<!-- HTML -->
<input type="text" id="nova-tarefa" placeholder="Nova tarefa...">
<button id="btn-add">Adicionar Tarefa</button>
<ul id="lista-tarefas"></ul>
<!-- JQUERY -->
<script>
 $(document).ready(function() {
 $('#btn-add').click(function() {
const item = $('#nova-tarefa').val();
if (item !== '') {
 $('#lista-tarefas').append(`<li>${item}</li>`);
 $('#nova-tarefa').val(''); // Limpa o campo
 }
 });
 });
</script>
